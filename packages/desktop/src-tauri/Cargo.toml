[package]
name = "favorites"
version = "0.1.0"
description = "收藏夹 - 个人收藏管理桌面应用"
authors = [""]
edition = "2021"

[lib]
name = "favorites_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "devtools",
] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
